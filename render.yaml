services:
  - type: web
    name: storeflow-staging-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: GUEST_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: OTP_HASH_SECRET
        sync: false
      - key: CATALOGUE_CURRENCY
        value: USD
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AUTH_RATE_LIMIT_LOGIN_PER_MINUTE
        value: "10"
      - key: AUTH_RATE_LIMIT_REGISTER_PER_MINUTE
        value: "5"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: OUTBOX_WORKER_ENABLED
        value: "true"
      - key: OUTBOX_POLL_INTERVAL_SECONDS
        value: "2.0"
      - key: OUTBOX_LEASE_SECONDS
        value: "60"
      - key: OUTBOX_BATCH_SIZE
        value: "10"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
